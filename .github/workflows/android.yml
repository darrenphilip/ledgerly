name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.LEDGERLY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ledgerly-release.jks"

      - name: Build APKs (branch / PR, unsigned release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Build APKs (tag, signed release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LEDGERLY_KEYSTORE: ${{ runner.temp }}/ledgerly-release.jks
          LEDGERLY_KEYSTORE_PASSWORD: ${{ secrets.LEDGERLY_KEYSTORE_PASSWORD }}
          LEDGERLY_KEY_ALIAS: ${{ secrets.LEDGERLY_KEY_ALIAS }}
          LEDGERLY_KEY_PASSWORD: ${{ secrets.LEDGERLY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ledgerly-${GITHUB_REF_NAME#v}.apk"
          echo "APK=$RUNNER_TEMP/ledgerly-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerly-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ledgerly ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: ${{ env.APK }}
          fail_on_unmatched_files: true